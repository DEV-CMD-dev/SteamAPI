<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two-Factor Authentication</title>
</head>

<body style="margin:0;padding:0;background:#192b3d;font-family:Arial,Helvetica,sans-serif;color:#d6d7d8;">
<div style="display:none;max-height:0;overflow:hidden;">
    Your NEXUS two-factor authentication verification code.
</div>

<table role="presentation" style="width:100%;border-collapse:collapse;">
    <tr>
        <td style="padding:40px 16px;">
            <table role="presentation" style="width:100%;max-width:600px;margin:0 auto;border-collapse:collapse;background:#1b2838;">
                <tr>
                    <td style="padding:28px 40px;background:linear-gradient(135deg,#1b2838,#171d25);border-bottom:1px solid #2a475e;">
                        <div style="font-size:28px;font-weight:bold;color:#ffffff;letter-spacing:1px;">
                            NEXUS
                        </div>
                    </td>
                </tr>

                <tr>
                    <td style="padding:40px;">
                        <h1 style="margin:0 0 20px;font-size:24px;line-height:1.3;font-weight:normal;color:#ffffff;">
                            Two-factor authentication
                        </h1>

                        <p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#c7d5e0;">
                            Use the verification code below to complete your login.
                        </p>

                        <div style="margin:0 0 30px;padding:22px;text-align:center;background:#171d25;border:1px solid #2a475e;">
                            <span style="font-size:30px;font-weight:bold;letter-spacing:7px;color:#66c0f4;">
                                {{Code}}
                            </span>
                        </div>

                        <p style="margin:0;font-size:13px;line-height:1.6;color:#8f98a0;">
                            If you didn't attempt to log in, you can safely ignore this email.
                        </p>
                    </td>
                </tr>

                <tr>
                    <td style="padding:20px 40px;background:#171d25;border-top:1px solid #2a475e;">
                        <p style="margin:0;font-size:11px;line-height:1.5;color:#68747e;">
                            This is an automated message. Please do not reply to this email.
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>

</body>
</html>
